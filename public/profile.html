<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل | کدفا</title><link rel="stylesheet" href="/css/style.css"><script src="/js/api.js" defer></script><script src="/js/profile.js" defer></script></head><body><header class="top"><a class="brand" href="/app.html">کد<span>فا</span></a><a href="/leaderboard.html">رتبه‌بندی</a></header><main class="page narrow"><h1>پروفایل من</h1><section class="panel"><form id="profile-form"><label>نام نمایشی<input name="display_name" required maxlength="40"></label><label>رنگ آواتار<input name="avatar_color" type="color" value="#35b86b"></label><label class="check"><input name="hide_from_leaderboard" type="checkbox"> در رتبه‌بندی نمایش داده نشوم</label><label>هدف روزانه XP<select name="daily_goal"><option value="10">۱۰ XP</option><option value="20">۲۰ XP</option><option value="30">۳۰ XP</option></select></label><label>تم رابط<select name="theme"><option value="light">روشن</option><option value="dark">تیره</option></select></label><label class="check"><input name="confetti_enabled" type="checkbox" checked> جشن پایان درس فعال باشد</label><button class="button">ذخیره تغییرات</button><p class="message" id="profile-msg"></p></form></section><section class="panel"><h2>تغییر رمز عبور</h2><form id="password-form"><label>رمز جدید<input name="password" type="password" minlength="8" required></label><button class="button secondary">تغییر رمز</button><p class="message" id="password-msg"></p></form></section><section class="panel"><h2>ماموریت‌های امروز</h2><div id="daily-quests"></div></section><section class="panel"><h2>دستاوردها</h2><div id="achievements-list"></div></section></main><script src="/js/quests.js" defer></script><script src="/js/achievements.js" defer></script></body></html>
